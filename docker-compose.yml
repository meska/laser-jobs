services:
  couchdb:
    image: couchdb:3.5.1
    container_name: laserjobs-db
    restart: unless-stopped
    environment:
      COUCHDB_USER: couchdb
      COUCHDB_PASSWORD: "1206b83e8b5f0c1f47e55a3e601c25b8c3a364aa55600159d63aedae49c82e34"
    ports:
      - "5984:5984"
    volumes:
      - couchdb-data:/opt/couchdb/data
      - ./docker/couchdb/local.ini:/opt/couchdb/etc/local.d/local.ini

  app:
    image: node:24.13.1
    container_name: laserjobs-app-dev
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - couchdb
    environment:
      VUE_APP_DB_URL: "/db"
      CHOKIDAR_USEPOLLING: "true"
      YARN_IGNORE_ENGINES: "true"
    volumes:
      - ./:/app
      - laserjobs-node-modules:/app/node_modules
    command: sh -lc "yarn install --ignore-engines && yarn serve --host 0.0.0.0 --port 8123"

  nginx:
    image: nginx:1.27-alpine
    container_name: laserjobs-nginx-dev
    restart: unless-stopped
    depends_on:
      - app
      - couchdb
    ports:
      - "8123:80"
    volumes:
      - ./nginx/dev-proxy.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  couchdb-data:
  laserjobs-node-modules:
